name: 🔄 Sync Universal Danmu Upstream

on:
  # 每周日北京时间 05:15 检查一次（UTC 周六 21:15）
  schedule:
    - cron: '15 21 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🟢 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔄 检查并同步上游
        run: python scripts/sync_danmu.py

      - name: ✅ 校验所有 Widget 语法
        run: |
          for f in widgets/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: 📤 提交并推送变更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add widgets/Universal-danmu.js .upstream-version
          if git diff --cached --quiet; then
            echo "上游无更新，无需提交"
          else
            git commit -m "chore(通用弹幕): 自动同步上游版本"
            git push
          fi
