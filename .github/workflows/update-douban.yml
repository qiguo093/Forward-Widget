name: 🎬 Update Douban Rankings

on:
  schedule:
    # 北京时间每天 08:00（UTC 00:00）
    - cron: '0 0 * * *'
    # 北京时间每天 20:00（UTC 12:00）
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 更新豆瓣榜单
        run: python scripts/update_douban.py
      - name: 提交数据
        run: |
          git config user.name 'GitHub Action Bot'
          git config user.email 'action@github.com'
          git add data/douban-hot.json
          git diff --cached --quiet || (git commit -m 'chore: 自动更新豆瓣榜单 🎬' && git push)
